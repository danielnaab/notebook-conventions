apiVersion: kb/v1
name: "<<WORKSPACE_NAME>>"
description: "<<ONE_LINE_DESCRIPTION>>"

entrypoints:
  human: README.md
  agent: AGENTS.md

imports:
  - kind: local
    path: .scions/knowledge-base-kit
    relationship: foundational
    sync_policy: extend
  - kind: local
    path: .scions/notebook-kit
    relationship: foundational
    sync_policy: extend

composition:
  precedence: domain-over-imports
  mergeStrategy: deep-merge

paths:
  # notebook/ is the Obsidian vault and an OKF bundle; the top level is the lifecycle, the domain is below it.
  vault: notebook
  raw: notebook/raw
  daily: notebook/records/daily
  sessions: notebook/records/sessions
  tasks: notebook/tasks
  wiki: notebook/wiki
  templates: notebook/templates
  docs: docs

sources:
  canonical:
    - path: AGENTS.md
      note: "Behavior and boundaries; higher-priority harness instructions still apply."
    - path: knowledge-base.yaml
      note: "Layout and behavioral write rules, not a technical enforcement mechanism."
    - path: flake.nix
      note: "The flake: graft wires the scions' tools; graft's own pin is in flake.lock."
    - path: notebook-kit.yaml
      note: "Settings for notebook-kit's tools: task records, Obsidian deviations."
  interpretation:
    - path: notebook/wiki/**
      note: "Current synthesis; project code/config and original sources remain authoritative."
    - path: docs/**
      note: "Workspace operating guidance."
  tracking:
    - path: notebook/tasks/**
      note: "Canonical current task state; index.md is generated from the records."
  historical:
    - path: notebook/records/**
      note: "Dated notes written once: daily ledger and session records, not current operational truth."
  raw:
    - path: notebook/raw/**
      note: "Sources as captured; never edited after capture."

rules:
  # Scopes for knowledge-base-kit's checker (just check-kb). Records and raw sources carry no status;
  # task records are checked by just check-tasks; .scions/ holds the scions (git submodules).
  checks:
    okf:
      bundle: notebook
      version: "0.2"
    links:
      include: [README.md, AGENTS.md, docs/**, notebook/**]
    lifecycle:
      include: [docs/**, notebook/wiki/**]
    provenance:
      include: [docs/**, notebook/wiki/**]
  lifecycle:
    # Applies to docs/ and wiki pages. Task records use their own status vocabulary
    # (kit docs/tasks.md); records and raw sources are dated or captured and carry no status.
    statuses: [draft, working, stable, deprecated]
  provenance:
    requiredFor: [factual-claims, operational-guidance]
  writes:
    allow: [notebook/tasks/**, notebook/wiki/**, notebook/index.md, "notebook/**/index.md", README.md]
    # Create new files; after a record's own date, change it only to add a dated correction. Raw sources never change.
    writeOnce: [notebook/records/**, notebook/raw/**]
    deny: [secrets/**, credentials/**, .env, .env.*, "**/*.key", "**/*.pem", "**/*.p12", "**/*.pfx", .git/**, .direnv/**]
    askFirst: [.scions/**, AGENTS.md, CLAUDE.md, knowledge-base.yaml, notebook-kit.yaml, flake.nix, flake.lock, .envrc, .gitignore, .gitattributes, notebook/.obsidian/**, notebook/.okfignore, .pi/**, docs/**, notebook/templates/**, scripts/**, tests/**, .githooks/**, .markdownlint-cli2.jsonc, justfile]
